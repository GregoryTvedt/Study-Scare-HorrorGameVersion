<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Jumpscare</title>
        <style>
            html, body {
                background-color: #333333;
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            #video-container {
                text-align: center;
                position: center;
                width: 100%;
            }
            #video{
                width: 60%;
                height: auto;
                display: inline-block;
            }
            .btn{
                font-family: Arial, sans-serif;
                font-size: 20px;
                width: 60%;
                height: auto;
                display: block;
                margin: 0 auto;
                background-color: #737373;
                color: black;
            }
            .btn:hover{
                background-color: #616161;
            }
            h1{
                font-family: Arial, sans-serif;
                color: #969696;
            }
            h3{
                font-family: Arial, sans-serif;
                color: #969696;
            }
        </style>
    </head>

    <body>
        <div id="video-container">
            <h1>Welcome to Study-Scare</h1>
            <h3>A program designed to Jumpscare you the moment you stop studying</h3>
            <h3>Press <b>CTRL+SHIFT+Q</b> To Exit When Done</h3>
            <video id="video" autoplay="true"></video>
            <button class="btn" id="start"><b>Start</b></button>
        </div>
    </body>
    <script>
        document.getElementById('start').addEventListener('click', () => {
            window.electronAPI.startTransparent();
        });
        
        
        const video = document.querySelector("#video");

        if(navigator.mediaDevices.getUserMedia)
        {
            navigator.mediaDevices.getUserMedia({video:true})
            .then(function(mediastream){
                video.onloadedmetadata = function() {
                    video.play().catch(function(error){
                        console.error("video play failed:", error);
                    });
                };
                
                video.srcObject = mediastream;
                
                const settings = mediastream.getVideoTracks()[0].getSettings();
                const canvas = document.querySelector("#canvas");
                
                canvas.width = settings.width;
                canvas.height = settings.height;
                console.log(canvas.width, canvas.height);

            })
            
            .catch(function(error){
                console.log("Something went wrong:",error);
            });
        }
    </script>
</html>
